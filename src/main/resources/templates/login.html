<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="brand">
            <div class="logo">LI</div>
            <div>
                <h2>Masuk</h2>
                <p class="lead">Masukkan kredensial Anda untuk melanjutkan</p>
            </div>
        </div>

        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" th:field="*{username}" placeholder="username" />
                <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" placeholder="password" />
                <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="error" th:if="${loginError}">[[${loginError}]]</div>

            <div class="actions">
                <button type="submit">Login</button>
                
            </div>
        </form>
    </div>
</div>
</body>
</html>
