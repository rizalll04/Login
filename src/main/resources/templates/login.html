<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title th:text="#{login.title}">
        Login
    </title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<script>
function changeLanguage(lang) {

    const url = new URL(window.location.href);

    url.searchParams.set("lang", lang);

    window.location.href = url.toString();
}
</script>
<body>


<div class="container">

    <div class="card">


        <!-- =========================
             LANGUAGE
        ========================== -->

        <div class="language-selector">

            <label for="language"
                   th:text="#{language.select}">
                Bahasa
            </label>


            <select id="language"
                    onchange="changeLanguage(this.value)">

                <option value="id"
                        th:selected="${#locale.language == 'id'}"
                        th:text="#{language.indonesia}">
                    Indonesia
                </option>


                <option value="en"
                        th:selected="${#locale.language == 'en'}"
                        th:text="#{language.english}">
                    English
                </option>


                <option value="zh"
                        th:selected="${#locale.language == 'zh'}"
                        th:text="#{language.chinese}">
                    中文
                </option>

            </select>

        </div>


        <!-- =========================
             BRAND
        ========================== -->

        <div class="brand">


            <div class="logo">

                <img th:src="@{/images/logo.png}"
                     alt="Logo">

            </div>


            <div>

                <h2 th:text="#{login.title}">
                    Masuk
                </h2>


                <p class="lead"
                   th:text="#{login.description}">

                    Masukkan Username dan Password Anda
                    untuk melanjutkan

                </p>

            </div>

        </div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form th:action="@{/login}"
              th:object="${loginForm}"
              method="post">


            <!-- USERNAME -->

            <div class="field">

                <label for="username"
                       th:text="#{login.username}">

                    Username

                </label>


                <input id="username"

                       type="text"

                       th:field="*{username}"

                       th:placeholder="#{login.username.placeholder}">

                <div class="error"

                     th:if="${#fields.hasErrors('username')}"

                     th:errors="*{username}">

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password"
                       th:text="#{login.password}">

                    Password

                </label>


                <input id="password"

                       type="password"

                       th:field="*{password}"

                       th:placeholder="#{login.password.placeholder}">

                <div class="error"

                     th:if="${#fields.hasErrors('password')}"

                     th:errors="*{password}">

                </div>

            </div>


            <!-- LOGIN ERROR -->

            <div class="error"
                 th:if="${loginError}"
                 th:text="${loginError}">

            </div>


            <!-- BUTTON -->

            <div class="actions">

                <button type="submit"
                        th:text="#{login.button}">

                    Login

                </button>

            </div>


        </form>

    </div>

</div>


</body>

</html>
